name: Checks and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned Lua 5.4
        run: python Tools/build_ci_lua.py
      - name: Run checks
        run: python Tools/run_checks.py --lua Tests/ci-lua/lua.exe
      - name: Build native components
        run: |
          python Tools/build_native.py --build 25940006
          python Tools/build_native.py --build 25431485
      - name: Run native behavior fixtures
        run: python Tools/run_native_tests.py
      - name: Prepare install packages
        run: |
          python Tools/package_release.py
          python Tools/build_easy_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: BladesongModFramework-preview
          path: Releases/
