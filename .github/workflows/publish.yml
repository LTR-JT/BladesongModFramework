name: Publish reviewed repository release
on:
  push:
    paths: ['.github/release-plan.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Matching v-tag for this repository
        required: true
        type: string
      draft:
        description: Keep as an unpublished draft
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BladesongModFramework
    steps:
      - uses: actions/checkout@v4
        with:
          path: BladesongModFramework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read explicit release approval
        id: release
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_DRAFT: ${{ inputs.draft }}
        run: |
          $meta = Get-Content mod.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:MANUAL_TAG
            $draft = $env:MANUAL_DRAFT
          } else {
            $plan = Get-Content .github/release-plan.json -Raw | ConvertFrom-Json
            if ($plan.publish -ne $true -or $plan.version -ne $meta.version) { throw 'Reviewed release plan required' }
            $tag = 'v' + $plan.version
            $draft = 'false'
          }
          if ($tag -ne ('v' + $meta.version)) { throw 'Tag must match repository version' }
          'tag=' + $tag >> $env:GITHUB_OUTPUT
          'draft=' + $draft >> $env:GITHUB_OUTPUT
      - name: Read reviewed build dependencies
        id: deps
        shell: pwsh
        run: |
          $buildDependencies = Get-Content BuildDependencies.json -Raw | ConvertFrom-Json
          'sdk_ref=' + $buildDependencies.sdk.ref >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: LTR-JT/BladesongSDK
          ref: ${{ steps.deps.outputs.sdk_ref }}
          path: BladesongSDK
      - run: python Tools/build_ci_lua.py
      - run: python Tools/run_checks.py --lua Tests/ci-lua/lua.exe
      - run: python Tools/build_native.py --build 25940006
      - run: python Tools/build_native.py --build 25431485
      - run: python Tools/build_native.py --build 26400894
      - run: python Tools/build_native.py --build 26433453
      - run: python Tools/run_native_tests.py
      - run: python Tools/package_release.py
      - run: python Tools/check_packages.py
      - name: Publish only this repository's checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        shell: pwsh
        run: |
          $assets = @(python Tools/release_component.py $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0) { throw 'Version/tag mismatch' }
          $options = @('--target', $env:GITHUB_SHA, '--notes-file', 'RELEASE_NOTES.md')
          if ($env:RELEASE_DRAFT -eq 'true') { $options += '--draft' }
          gh release create $env:RELEASE_TAG @assets @options
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
