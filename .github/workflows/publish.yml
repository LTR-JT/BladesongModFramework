name: Publish release
on:
  push:
    paths: ['.github/release-plan.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read release plan
        id: plan
        shell: pwsh
        run: |
          $plan = Get-Content .github/release-plan.json | ConvertFrom-Json
          'publish=' + $plan.publish.ToString().ToLower() >> $env:GITHUB_OUTPUT
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/build_ci_lua.py
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/run_checks.py --lua Tests/ci-lua/lua.exe
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/build_native.py --build 25940006
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/build_native.py --build 25431485
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/run_native_tests.py
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/package_release.py
      - if: steps.plan.outputs.publish == 'true'
        run: python Tools/build_easy_install.py
      - name: Publish checked packages
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $meta = Get-Content mod.json | ConvertFrom-Json
          $tag = 'v' + $meta.version
          $assets = @(Get-ChildItem Releases/*.zip | ForEach-Object FullName)
          $assets += @((Resolve-Path Releases/mod.json).Path, (Resolve-Path Releases/SHA256SUMS.txt).Path)
          gh release create $tag @assets --target $env:GITHUB_SHA --title ($meta.name + ' ' + $tag) --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
